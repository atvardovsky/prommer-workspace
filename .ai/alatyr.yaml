known_gaps:
  - "Named human owner identities are not available; repository-maintainer roles are used."
  - "Codex loading is configured through AGENTS.md but has not been independently observed in a later session."
  - "Production deployment, model selection, live-provider verification, LinkedIn publication, CI, and persistent approval expectations are not established."
  - "Optional modules other than AI infrastructure, architecture knowledge, blueprint change, Debug Mode, effectiveness metrics, installed operations, multi-assistant bridges, and subagent delegation remain deferred until target evidence justifies them."
local_deviations:
  - "The core support profile uses the complete framework pack so project knowledge, development-pattern evidence, Debug Mode, and their required dependencies are available."
  - "Diagram routing is disabled. Portable framework diagram guidance remains installed as inert complete-pack documentation."
  - "Structured records are permitted only under the project retention policy; non-product contextual metadata, raw prompts, transcripts, timing, drafts, private reasoning, and credentials remain prohibited."
  - "Delegation uses the shared Codex workspace with packet-level disjoint-write enforcement; the primary assistant retains decisions, approvals, integration, and final convergence."
  - "Architecture knowledge records the accepted modular POC boundary; production deployment and authenticated LinkedIn publication remain unknown."
  - "AlatyrCore source validation tools are not vendored into the target."
